# Serves the workbench at / and the base visualisation dashboard at /legacy-app/
server {
    listen 9091;
    server_name _;
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    location /legacy-app/api/ {
        proxy_pass http://127.0.0.1:8096/api/;
        proxy_set_header Host 127.0.0.1:8096;
        proxy_set_header Origin http://127.0.0.1:8096;
        add_header Cache-Control "no-store";
    }
    location /legacy-app/assets/ {
        proxy_pass http://127.0.0.1:8096/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /legacy-app/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_set_header Host 127.0.0.1:8096;
        proxy_set_header Origin http://127.0.0.1:8096;
        add_header Cache-Control "no-store";
    }
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host 127.0.0.1:8095;
        proxy_set_header Origin http://127.0.0.1:8095;
        proxy_read_timeout 300s;
    }
}
