name: mcibench

services:
  backend:
    build:
      context: ./packages/server
      dockerfile: Dockerfile
      args:
        BASE_GOLANG_IMAGE: ${BASE_GOLANG_IMAGE:-golang:1.25}
        BASE_DEBIAN_IMAGE: ${BASE_DEBIAN_IMAGE:-debian:bookworm-slim}
    image: mcibench-server:${MCIBENCH_TAG:-latest}
    container_name: mcibench-backend
    restart: unless-stopped
    environment:
      MCIBENCH_SERVER_PORT: 8080
      MCIBENCH_SERVER_MODE: release
      MCIBENCH_DATABASE_PATH: /app/data/mcibench.db
    volumes:
      - ./volumes/backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/config/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE:-node:22-alpine}
        BASE_NGINX_IMAGE: ${BASE_NGINX_IMAGE:-nginx:1.27-alpine}
    image: mcibench-frontend:${MCIBENCH_TAG:-latest}
    container_name: mcibench-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
